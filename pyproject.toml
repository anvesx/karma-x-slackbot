[project]
name = "karma-x-slackbot"
version = "0.1.0"
description = "A small Slack recognition bot with SQLite"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["slack-sdk>=3.45,<4", "fastapi>=0.143,<1", "uvicorn>=0.54,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "ruff>=0.17,<1", "mypy>=2.4,<3", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karma_x"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/karma_x"]
