# --- model path and repeated mentions ------------------------------------------
[[case]]
name = "model only: no cue but content"
rule = "confirm_cutoff"
text = "<@UB> fixed the payment retries overnight"
expect = { UB = "confirm" }
nomodel = { UB = "ignore" }

[[case]]
name = "repeat: strongest outcome wins"
rule = "merge"
text = "thanks <@UB>. Kudos <@UB> for fixing the payment retries today"
expect = { UB = "auto" }

[[case]]
name = "repeat: auto beats ignore"
rule = "merge"
text = "<@UB> can you check? Kudos <@UB> for fixing the payment retries"
expect = { UB = "auto" }

[[case]]
name = "mixed outcomes in one message"
rule = "per mention"
text = "Kudos to <@UA> for fixing the payment retries. thanks <@UB> for the link"
expect = { UA = "auto", UB = "confirm" }

# --- review fixes: requests phrased as thanks, dev jargon that is not praise ---
[[case]]
name = "request phrased with appreciate"
rule = "V3"
text = "<@UR> I'd appreciate a review of the migration plan before Friday"
expect = { UR = "ignore" }

[[case]]
name = "would appreciate it if"
rule = "V3"
text = "<@UR> would appreciate it if the staging database gets reset tonight"
expect = { UR = "ignore" }

[[case]]
name = "thanks in advance is a request"
rule = "V3"
text = "<@UR> thanks in advance for reviewing the deploy plan tomorrow"
expect = { UR = "ignore" }

[[case]]
name = "tia is a request"
rule = "V3"
text = "<@UR> tia for sharing the release checklist with the client team"
expect = { UR = "ignore" }

[[case]]
name = "mvp is product jargon, not praise"
rule = "no cue (model-only)"
text = "<@UM> the MVP scope is frozen for next sprint"
expect = { UM = "confirm" }
nomodel = { UM = "ignore" }

[[case]]
name = "legend on a chart is not praise"
rule = "no cue (model-only)"
text = "<@UL> the legend on the revenue chart is wrong"
expect = { UL = "confirm" }
nomodel = { UL = "ignore" }

[[case]]
name = "you're a legend is praise"
rule = "A2"
text = "<@UL> you're a legend for fixing the payment retries overnight"
expect = { UL = "auto" }

