# Made-up recognition cases. Scored with a fake scorer returning 0.95.
# `expect` maps each mentioned user to the outcome; `nomodel` (optional) overrides the
# NoModel result, which is otherwise the same with every "auto" turned into "confirm".
# Author is U1 unless `author` is set. `blocks` are optional rich_text pieces.

# --- worked cases from the spec -------------------------------------------------
[[case]]
name = "worked: kudos to two people"
rule = "A1 name-group"
text = "Huge kudos to <@UA> and <@UB> for shipping Mayave through the ERP change"
expect = { UA = "auto", UB = "auto" }

[[case]]
name = "worked: opening line passes kudos to bullets"
rule = "K-inherited"
text = "Big kudos to the team!\n• <@UJ> — worked from the client office through go-live\n• <@UY> — built the website integration"
expect = { UJ = "auto", UY = "auto" }

[[case]]
name = "worked: thank you, really appreciated"
rule = "T cue, no content"
text = "Thank you, <@UK>. Really appreciated."
expect = { UK = "confirm" }

[[case]]
name = "worked: thanks for the link"
rule = "trivial favour"
text = "thanks <@UB> for the link"
expect = { UB = "confirm" }

[[case]]
name = "worked: request then thanks"
rule = "V2 V3"
text = "<@UB> can you review my PR? thanks"
expect = { UB = "ignore" }

[[case]]
name = "worked: cc"
rule = "V1"
text = "CC- <@UK>"
expect = { UK = "ignore" }

[[case]]
name = "worked: sarcasm emoji"
rule = "V5"
text = "great job breaking prod <@UX> 🙃"
expect = { UX = "ignore" }

[[case]]
name = "worked: good job with emoji only"
rule = "P cue, emoji is not content"
text = "Good job <@UP> :cherry_blossom:"
expect = { UP = "confirm" }

[[case]]
name = "worked: emoji only"
rule = "emoji is never a cue"
text = "<@UN> :fire: :fire:"
expect = { UN = "ignore" }

[[case]]
name = "worked: thanks for nothing"
rule = "V4"
text = "thanks for nothing <@UX>"
expect = { UX = "ignore" }

[[case]]
name = "worked: please do the needful"
rule = "V3"
text = "<@UK> - please do the needful :moneybag:"
expect = { UK = "ignore" }

# --- clean ----------------------------------------------------------------------
[[case]]
name = "clean: quoted line is removed"
rule = "clean quote"
text = "> thanks <@UB> for everything you did\nsee above"
expect = {}

[[case]]
name = "clean: fenced code is removed"
rule = "clean fence"
text = "```\nthanks <@UB>\n```\nok"
expect = {}

[[case]]
name = "clean: inline code is removed"
rule = "clean backticks"
text = "run `kudos <@UB>` now"
expect = {}

[[case]]
name = "clean: bare url with question mark"
rule = "clean URL"
text = "Kudos to <@UB> for fixing the payment retries https://example.test/a?b=1"
expect = { UB = "auto" }

[[case]]
name = "clean: slack url with question mark"
rule = "clean URL"
text = "<https://example.test/a?b=1|PR> Kudos to <@UB> for fixing the payment retries"
expect = { UB = "auto" }

[[case]]
name = "clean: here is removed"
rule = "clean broadcast"
text = "<!here> kudos to <@UB> for fixing the payment retries"
expect = { UB = "auto" }

[[case]]
name = "clean: subteam is removed"
rule = "clean broadcast"
text = "<!subteam^S1> thanks <@UB> for fixing the payment retries today"
expect = { UB = "auto" }

[[case]]
name = "clean: mention with display name"
rule = "mention markup"
text = "Kudos <@UB|bob> for fixing the payment retries"
expect = { UB = "auto" }

# --- gate -----------------------------------------------------------------------
[[case]]
name = "gate: self mention"
rule = "step 0"
text = "Kudos to <@U1> for fixing the payment retries"
expect = { U1 = "ignore" }

[[case]]
name = "gate: no mention"
rule = "step 0"
text = "Kudos to everyone for fixing the payment retries"
expect = {}

[[case]]
name = "gate: no author"
rule = "step 0"
author = ""
text = "Kudos to <@UB> for fixing the payment retries"
expect = {}

# --- segment and attribute ------------------------------------------------------
[[case]]
name = "segment: dash bullet without opening cue relies on the model"
rule = "segment bullets"
text = "- <@UB> — fixed the payment retries"
expect = { UB = "confirm" }
nomodel = { UB = "ignore" }

[[case]]
name = "segment: numbered bullets inherit kudos"
rule = "K-inherited"
text = "Kudos this week:\n1. <@UB> — fixed the payment retries\n2. <@UC> — wrote the migration guide"
expect = { UB = "auto", UC = "auto" }

[[case]]
name = "attribute: colon separator inherits"
rule = "K-inherited"
text = "Shout out to the team\n<@UB>: led the vendor negotiation"
expect = { UB = "auto" }

[[case]]
name = "attribute: opening line naming someone does not inherit"
rule = "K-inherited"
text = "Kudos to <@UA>!\n<@UB> - wrote the migration guide"
expect = { UA = "confirm", UB = "confirm" }
nomodel = { UA = "confirm", UB = "ignore" }

[[case]]
name = "attribute: no separator does not inherit"
rule = "K-inherited"
text = "Kudos to the team\n<@UB> wrote the migration guide"
expect = { UB = "confirm" }
nomodel = { UB = "ignore" }

[[case]]
name = "segment: sentences are isolated"
rule = "segment sentences"
text = "Thanks <@UB> for the quick fix on the billing report. <@UC> can you review my PR?"
expect = { UB = "auto", UC = "ignore" }

[[case]]
name = "segment: rich_text list item"
rule = "segment blocks"
text = "Kudos to the team\n<@UB> — led the vendor negotiation"
blocks = [
  { kind = "section", text = "Kudos to the team" },
  { kind = "list_item", text = "<@UB> — led the vendor negotiation" },
]
expect = { UB = "auto" }

[[case]]
name = "segment: rich_text section split on newlines"
rule = "segment blocks"
text = "Kudos to <@UB> for fixing the payment retries\nplease ping <@UC> about it"
blocks = [
  { kind = "section", text = "Kudos to <@UB> for fixing the payment retries\nplease ping <@UC> about it" },
]
expect = { UB = "auto", UC = "ignore" }

[[case]]
name = "attribute: name group shares the segment"
rule = "name group"
text = "Kudos <@UA>, <@UB> & <@UC> for shipping the ERP rollout"
expect = { UA = "auto", UB = "auto", UC = "auto" }

[[case]]
name = "attribute: cc applies to the whole group"
rule = "V1 name group"
text = "cc <@UA> and <@UB>"
expect = { UA = "ignore", UB = "ignore" }

[[case]]
name = "attribute: cc only hits the mention after it"
rule = "V1"
text = "thanks <@UA> for writing the onboarding guide, cc <@UB>"
expect = { UA = "auto", UB = "ignore" }

